<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diep.io Tek Oyunculu V2</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #1e1e1e;
    }
    canvas {
      display: block;
    }
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div id="hud">Seviye: 1 | XP: 0 / 100</div>
  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const hud = document.getElementById('hud');

    const keys = {};
    let mouseX = 0;
    let mouseY = 0;

    const player = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      size: 20,
      speed: 3,
      angle: 0,
      bullets: [],
      fireRate: 300,
      lastShot: 0,
      level: 1,
      xp: 0,
      nextLevelXP: 100
    };

    const enemies = [];

    function spawnEnemy() {
      const side = Math.floor(Math.random() * 4);
      let x, y;
      if (side === 0) {
        x = Math.random() * canvas.width;
        y = -30;
      } else if (side === 1) {
        x = canvas.width + 30;
        y = Math.random() * canvas.height;
      } else if (side === 2) {
        x = Math.random() * canvas.width;
        y = canvas.height + 30;
      } else {
        x = -30;
        y = Math.random() * canvas.height;
      }
      enemies.push({ x, y, size: 15, speed: 1.5 });
    }

    setInterval(spawnEnemy, 1500);

    window.addEventListener('keydown', e => keys[e.key] = true);
    window.addEventListener('keyup', e => keys[e.key] = false);
    canvas.addEventListener('mousemove', e => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });
    canvas.addEventListener('mousedown', () => shoot());

    function shoot() {
      const now = Date.now();
      if (now - player.lastShot >= player.fireRate) {
        const angle = Math.atan2(mouseY - player.y, mouseX - player.x);
        player.bullets.push({
          x: player.x,
          y: player.y,
          dx: Math.cos(angle) * 7,
          dy: Math.sin(angle) * 7,
          size: 5
        });
        player.lastShot = now;
      }
    }

    function update() {
      if (keys['w']) player.y -= player.speed;
      if (keys['s']) player.y += player.speed;
      if (keys['a']) player.x -= player.speed;
      if (keys['d']) player.x += player.speed;

      player.bullets.forEach(b => {
        b.x += b.dx;
        b.y += b.dy;
      });

      enemies.forEach(e => {
        const angle = Math.atan2(player.y - e.y, player.x - e.x);
        e.x += Math.cos(angle) * e.speed;
        e.y += Math.sin(angle) * e.speed;
      });

      // Bullet-enemy collision
      player.bullets = player.bullets.filter(b => {
        let hit = false;
        enemies.forEach((e, i) => {
          const dist = Math.hypot(b.x - e.x, b.y - e.y);
          if (dist < e.size + b.size) {
            enemies.splice(i, 1);
            hit = true;
            player.xp += 25;
            if (player.xp >= player.nextLevelXP) {
              player.level += 1;
              player.xp = 0;
              player.nextLevelXP += 50;
            }
          }
        });
        return !hit;
      });

      hud.textContent = `Seviye: ${player.level} | XP: ${player.xp} / ${player.nextLevelXP}`;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw player
      ctx.save();
      ctx.translate(player.x, player.y);
      player.angle = Math.atan2(mouseY - player.y, mouseX - player.x);
      ctx.rotate(player.angle);
      ctx.fillStyle = 'deepskyblue';
      ctx.beginPath();
      ctx.arc(0, 0, player.size, 0, Math.PI * 2);
      ctx.fill();

      // Cannon
      ctx.fillStyle = 'white';
      ctx.fillRect(0, -5, player.size + 10, 10);
      ctx.restore();

      // Bullets
      ctx.fillStyle = 'yellow';
      player.bullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
        ctx.fill();
      });

      // Enemies
      ctx.fillStyle = 'red';
      enemies.forEach(e => {
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.size, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
